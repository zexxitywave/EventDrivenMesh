# ============================================================
# Nginx — edge reverse proxy in FRONT of the Spring Cloud Gateway.
#
# Layout:
#   Client ──► Nginx (this file, edge port) ──► api-gateway (:8080) ──► microservices
#
# Nginx does: TLS termination (when enabled), gzip, request size caps,
# connection pooling, timeouts, access/error logging.
# The gateway still owns: routing (lb://), JWT auth, rate limiting.
# ============================================================

worker_processes  auto;

events {
    worker_connections  1024;
}

http {

    # Hide Nginx version in headers/error pages
    server_tokens off;

    # ── Logging ────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ─────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ── Compression ─────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── Request caps ────────────────────────────────────────────
    client_max_body_size 10m;

    include  /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Upstream: the Spring Cloud Gateway ──────────────────────
    # host.docker.internal = the host machine running api-gateway on :8080
    # (Docker Desktop special DNS; works on Windows & macOS)
    upstream api_gateway {
        server host.docker.internal:8080;
        keepalive 32;            # HTTP/1.1 keep-alive to the gateway
    }

    server {
        listen       80;
        server_name  _;

        # Simple edge health check (does NOT hit the gateway)
        location = /nginx-health {
            access_log off;
            return 200 'ok\n';
        }

        # ── All API traffic → api-gateway ─────────────────────
        location / {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Host    $host;
            proxy_set_header   X-Forwarded-Port    $server_port;

            # SSE streams (/api/v1/orders/*/status-stream) must NOT be buffered
            proxy_buffering    off;
            proxy_cache        off;

            proxy_connect_timeout 5s;
            proxy_read_timeout    3600s;   # long-lived SSE: don't kill idle streams
            proxy_send_timeout    60s;
        }

        # ── Static frontend (optional — uncomment to serve a SPA at /) ──
        # location / {
        #     root   /usr/share/nginx/html;
        #     try_files $uri $uri/ /index.html;
        # }
        #
        # location /api/ {
        #     proxy_pass http://api_gateway;
        #     ...
        # }

        # ── TLS (optional — drop in your certs, re-run nginx on :443) ──
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/ssl/server.crt;
        # ssl_certificate_key /etc/nginx/ssl/server.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;

        # ── Friendly error pages instead of raw 502s ────────────
        error_page  502 503 504 /5xx.html;
        location = /5xx.html {
            root   /usr/share/nginx/html;
            internal;
        }
    }
}