name: CI — Build, Test & Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Job 1: compile + test + produce JARs (all services in one Maven run) ──
  build-and-test:
    name: Build & Test (Java 21 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules (skip tests)
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Run unit tests
        run: mvn test --no-transfer-progress

      # Upload every service JAR so docker-publish jobs can use them
      # without running Maven again inside Docker
      - name: Upload all service JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            */target/*.jar
            !*/target/*-sources.jar
          retention-days: 1

  # ── Job 2: build + push Docker images (main branch only) ──────────────────
  docker-publish:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: service-registry
          - name: api-gateway
          - name: auth-service
          - name: order-service
          - name: inventory-service
          - name: payment-service
          - name: notification-service
          - name: shipping-service
          - name: user-service
          - name: product-service
          - name: cart-service
          - name: wishlist-service
          - name: seller-service
          - name: logging-service
          - name: analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download the pre-built JARs from Job 1 — no Maven needed in Docker
      - name: Download pre-built JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:buildcache,mode=max
