server:
  port: 8086

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db?options=-c%20TimeZone=UTC&sslmode=disable
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true      # port 587 uses STARTTLS — start plain then upgrade to TLS
            required: true
          ssl:
            enable: false     # ssl.enable=true is for port 465 (SSL/TLS), NOT 587

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2000
      timeout: 2000

app:
  jwt:
    secret: ${JWT_SECRET:22a0de5355c2b9acf34fff4392a5e9439f59d26f1f0fba6012629bc0290a576c}
    access-token-expiration-ms: 9000000
    refresh-token-expiration-ms: 604800000

  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  email:
    otp-expiry-minutes: 90
    from: noreply@zexxity.online

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

  instance:
    prefer-ip-address: true

logging:
  level:
    com.hacisimsek.auth: DEBUG
    org.springframework.security: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always


