global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: [ localhost:9090 ]

  # ── Order Service ──────────────────────────────────────────────────────────
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ host.docker.internal:8081 ]
        labels:
          service: order-service

  # ── Inventory Service ──────────────────────────────────────────────────────
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
