global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: zexxity-ecommerce

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: [ localhost:9090 ]

  # â”€â”€ Order Service (port 8081) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 192.168.1.4:8081 ]
        labels:
          application: order-service

