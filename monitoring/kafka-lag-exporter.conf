kafka-lag-exporter {
  # How often to poll consumer group offsets (seconds)
  poll-interval = 30 seconds

  # Kafka cluster to monitor
  clusters = [
    {
      name = "zexxity-cluster"
      bootstrap-brokers = "kafka:29092"

      # Consumer groups to monitor — all saga and analytics groups
      group-whitelist = [
        "order-service-group",
        "inventory-service-group",
        "payment-service-group",
        "shipping-service-group",
        "notification-service-group",
        "logging-service-group",
        "analytics-service-group"
      ]
    }
  ]

  # Prometheus metrics server
  port = 8000
}
