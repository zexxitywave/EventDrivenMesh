server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2000
      timeout: 2000

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - name: RequestRateLimiter
          args:
            rate-limiter: "#{@standardLimiter}"
            key-resolver: "#{@ipKeyResolver}"
            deny-empty-key: false
            empty-key-status: 429

      routes:

        # Auth Service — tightest limit (brute-force / spam protection)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@authRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Razorpay Webhook — high limit, no JWT, never block Razorpay
        - id: payment-webhook
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/webhook/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@webhookLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Order Service — strict (order spam prevention)
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@strictLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Order SSE stream — relaxed limit (long-lived connections, not transactions)
        - id: order-service-sse
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/*/status-stream
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Inventory Service — standard
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Payment Service — strict (financial operations)
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@strictLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Shipping Service — standard
        - id: shipping-service
          uri: lb://shipping-service
          predicates:
            - Path=/api/v1/shipping/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Notification Service — standard
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # User Service — standard
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Product Service — relaxed (high read traffic expected)
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@relaxedLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Cart Service — standard
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Wishlist Service — standard
        - id: wishlist-service
          uri: lb://wishlist-service
          predicates:
            - Path=/api/v1/wishlist/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Seller Service — standard
        - id: seller-service
          uri: lb://seller-service
          predicates:
            - Path=/api/v1/seller/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Seller Admin — ADMIN role required
        - id: seller-admin
          uri: lb://seller-service
          predicates:
            - Path=/api/v1/admin/sellers/**
          filters:
            - JwtAuthFilter
            - name: RoleAuthorizationFilter
              args:
                roles: ROLE_ADMIN
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # Logging Service — ADMIN role required (sensitive log data)
        - id: logging-service
          uri: lb://logging-service
          predicates:
            - Path=/api/v1/logs/**
          filters:
            - JwtAuthFilter
            - name: RoleAuthorizationFilter
              args:
                roles: ROLE_ADMIN
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # OpenAPI docs proxy routes (no JWT, no rate limit — internal dev tool)
        - id: order-service-docs
          uri: lb://order-service
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - RewritePath=/v3/api-docs/order-service, /v3/api-docs

        - id: inventory-service-docs
          uri: lb://inventory-service
          predicates:
            - Path=/v3/api-docs/inventory-service
          filters:
            - RewritePath=/v3/api-docs/inventory-service, /v3/api-docs

        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - RewritePath=/v3/api-docs/payment-service, /v3/api-docs

        - id: shipping-service-docs
          uri: lb://shipping-service
          predicates:
            - Path=/v3/api-docs/shipping-service
          filters:
            - RewritePath=/v3/api-docs/shipping-service, /v3/api-docs

        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs

        - id: product-service-docs
          uri: lb://product-service
          predicates:
            - Path=/v3/api-docs/product-service
          filters:
            - RewritePath=/v3/api-docs/product-service, /v3/api-docs

        - id: cart-service-docs
          uri: lb://cart-service
          predicates:
            - Path=/v3/api-docs/cart-service
          filters:
            - RewritePath=/v3/api-docs/cart-service, /v3/api-docs

        - id: wishlist-service-docs
          uri: lb://wishlist-service
          predicates:
            - Path=/v3/api-docs/wishlist-service
          filters:
            - RewritePath=/v3/api-docs/wishlist-service, /v3/api-docs

        - id: seller-service-docs
          uri: lb://seller-service
          predicates:
            - Path=/v3/api-docs/seller-service
          filters:
            - RewritePath=/v3/api-docs/seller-service, /v3/api-docs

        - id: logging-service-docs
          uri: lb://logging-service
          predicates:
            - Path=/v3/api-docs/logging-service
          filters:
            - RewritePath=/v3/api-docs/logging-service, /v3/api-docs

        - id: analytics-service-docs
          uri: lb://analytics-service
          predicates:
            - Path=/v3/api-docs/analytics-service
          filters:
            - RewritePath=/v3/api-docs/analytics-service, /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:22a0de5355c2b9acf34fff4392a5e9439f59d26f1f0fba6012629bc0290a576c}

  # Kafka — used by LogPublisher for structured access logging
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

# OpenAPI aggregation — Swagger UI at http://localhost:8080/swagger-ui.html
# Aggregates API docs from all downstream services into one UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: order-service
        url: /v3/api-docs/order-service
      - name: inventory-service
        url: /v3/api-docs/inventory-service
      - name: payment-service
        url: /v3/api-docs/payment-service
      - name: shipping-service
        url: /v3/api-docs/shipping-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: user-service
        url: /v3/api-docs/user-service
      - name: product-service
        url: /v3/api-docs/product-service
      - name: cart-service
        url: /v3/api-docs/cart-service
      - name: wishlist-service
        url: /v3/api-docs/wishlist-service
      - name: seller-service
        url: /v3/api-docs/seller-service
      - name: logging-service
        url: /v3/api-docs/logging-service
      - name: analytics-service
        url: /v3/api-docs/analytics-service
  api-docs:
    enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.data.redis: WARN
