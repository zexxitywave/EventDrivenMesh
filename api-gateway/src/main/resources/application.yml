server:
  port: 8080

spring:
  application:
    name: api-gateway

  # â”€â”€ Redis (used by RequestRateLimiter to store token buckets per IP) â”€â”€â”€â”€â”€â”€â”€â”€
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2000
      timeout: 2000

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # â”€â”€ Default 429 response headers exposed to clients â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      default-filters:
        - name: RequestRateLimiter
          args:
            # fallback limiter applied to any route not explicitly configured
            rate-limiter: "#{@standardLimiter}"
            key-resolver: "#{@ipKeyResolver}"
            deny-empty-key: false          # don't crash if IP can't be resolved
            empty-key-status: 429

      routes:

        # â”€â”€ Auth Service â€” tightest limit (brute-force / spam protection) â”€â”€â”€
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@authRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Razorpay Webhook â€” high limit, no JWT, never block Razorpay â”€â”€â”€â”€â”€
        - id: payment-webhook
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/webhook/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@webhookLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Order Service â€” strict (order spam prevention) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@strictLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Inventory Service â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Payment Service â€” strict (financial operations) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@strictLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Shipping Service â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: shipping-service
          uri: lb://shipping-service
          predicates:
            - Path=/api/shipping/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Notification Service â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ User Service â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Product Service â€” relaxed (high read traffic expected) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@relaxedLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Cart Service â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Wishlist Service â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: wishlist-service
          uri: lb://wishlist-service
          predicates:
            - Path=/api/wishlist/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Seller Service â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: seller-service
          uri: lb://seller-service
          predicates:
            - Path=/api/seller/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Seller Admin â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: seller-admin
          uri: lb://seller-service
          predicates:
            - Path=/api/admin/sellers/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

        # â”€â”€ Logging Service â€” standard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        - id: logging-service
          uri: lb://logging-service
          predicates:
            - Path=/api/logs/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@standardLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false
                empty-key-status: 429

app:
  jwt:
    secret: ${JWT_SECRET:22a0de5355c2b9acf34fff4392a5e9439f59d26f1f0fba6012629bc0290a576c}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.data.redis: WARN

