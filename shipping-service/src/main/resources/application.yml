# Set to true to simulate a shipping failure and observe the full saga rollback:
#   - order status â†’ FAILED
#   - inventory stock released (compensation via InventorySagaHandler)
#   - notification sent to customer
shipping:
  force-failure: false
  h3:
    resolution: 8
    zone-resolution: 6
  geocoding:
    base-url: https://nominatim.openstreetmap.org
    user-agent: EventDrivenMesh-shipping/0.1 (dev)
    timeout-ms: 5000
  pricing:
    base-fee: 49.00
    per-km: 1.50
    max-charge: 549.00
    fallback-charge: 99.00
  hubs:
    - name: New Delhi Hub
      lat: 28.6139
      lng: 77.2090
    - name: Mumbai Hub
      lat: 19.0760
      lng: 72.8777
    - name: Bengaluru Hub
      lat: 12.9716
      lng: 77.5946
    - name: Kolkata Hub
      lat: 22.5726
      lng: 88.3639
    - name: Chennai Hub
      lat: 13.0827
      lng: 80.2707


---
# Chaos Monkey for Spring Boot — activates ONLY with the 'chaos-monkey' profile.
# Start with: --spring.profiles.active=chaos-monkey
# Runtime control: GET  /actuator/chaosmonkey        (status)
#                  POST /actuator/chaosmonkey/assaults (tune assaults live)
spring:
  config:
    activate:
      on-profile: chaos-monkey

chaos:
  monkey:
    enabled: true
    watcher:
      rest-controller: true
      service: true
      repository: false
    assaults:
      latency-active: true
      latency-range-start: 1000
      latency-range-end: 3000
      exceptions-active: true
      kill-application-active: false

