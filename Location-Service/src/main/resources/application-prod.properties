# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── PostgreSQL (EC2 local) ────────────────────────────────────────────────────
# PostgreSQL runs on the same EC2 instance, default port 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/location_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── Geocoding ────────────────────────────────────────────────────────────────
geocoding.user-agent=LocationService/1.0 (jagdish-location-app; contact@example.com)
geocoding.nominatim-url=https://nominatim.openstreetmap.org/reverse
