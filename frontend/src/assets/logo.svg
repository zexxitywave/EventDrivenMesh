<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 180 850 260" width="480" height="140">
  <defs>
    <style>
            
      .text-shop{
    font-family: Outfit, Poppins, "Segoe UI", sans-serif;
    font-weight:700;
    font-size:104px;
    fill:#101828;
    letter-spacing:-1px;
}

.text-sphere{
    font-family: Outfit, Poppins, "Segoe UI", sans-serif;
    font-weight:700;
    font-size:104px;
    fill:#FF8A00;
}

.text-tagline{
    font-family: Inter, Arial, sans-serif;
    font-weight:500;
    font-size:25px;
    fill:#5A6470;
    letter-spacing:6px;
}
    </style>
  </defs>


  <g>
    <!-- LOGO ICON -->
    <g id="cart-logo">
      <!-- Orange Handle and Base Frame -->
      <path d="M 102 214 
               C 96 214, 91 219, 91 225 
               C 91 231, 96 236, 102 236 
               L 125 236 
               C 134 236, 142 242, 145 251 
               L 165 310 
               C 168 318, 172 322, 180 322 
               L 262 322 
               C 255 310, 172 310, 172 310 
               L 155 258 
               C 150 242, 137 231, 121 231 
               L 102 231 Z" 
            fill="#FF8A00" />
      
      <!-- Real smooth orange handle tube -->
      <path d="M 96 220 
               C 96 214, 101 209, 108 209 
               L 128 209 
               C 142 209, 154 219, 159 233 
               L 173 277 
               L 157 277 
               L 145 238 
               C 142 229, 136 224, 128 224 
               L 108 224 
               C 101 224, 96 220, 96 220 Z" 
            fill="#FF7A00" />

      <!-- Cart Basket (Dark Blue Main Body) -->
      <path d="M 166 226 
               L 282 226 
               C 287 226, 291 230, 290 235 
               L 278 300 
               C 276 308, 269 314, 261 314 
               L 179 314 
               C 171 314, 164 308, 162 300 
               L 156 266 
               L 170 266 
               L 175 298 
               C 176 301, 178 302, 181 302 
               L 259 302 
               C 262 302, 264 300, 265 297 
               L 276 238 
               L 169 238 
               Z" 
            fill="#101828" />

      <!-- Inner Horizontal Basket Lines (Orange) -->
      <rect x="186" y="249" width="55" height="6.5" rx="3.25" fill="#FF7A00" />
      <rect x="190" y="265" width="47" height="6.5" rx="3.25" fill="#FF7A00" />

      <!-- Wheels (Dark Blue) -->
      <circle cx="180" cy="338" r="12.5" fill="#101828" />
      <circle cx="230" cy="338" r="12.5" fill="#101828" />

      <!-- Smile Curve / Swoosh below cart (Orange) -->
      <path d="M 106 337 
               C 142 370, 238 382, 287 339 
               C 289 337, 292 338, 291 341 
               C 285 352, 273 363, 253 371 
               C 207 389, 142 381, 104 340 
               C 103 338, 105 336, 106 337 Z" 
            fill="#FF7A00" />
      
      <!-- Arrowhead on the right of the swoosh -->
      <path d="M 276 336 
               L 295 348 
               L 282 359 
               C 281 356, 280 348, 276 336 Z" 
            fill="#FF7A00" />
    </g>

    <!-- BRAND TEXT: ShopSphere -->
    <g id="brand-name">
      <text x="300" y="335" class="text-shop">
    Shop
    <tspan class="text-sphere" dx="6">
        Sphere
    </tspan>
</text>
    </g>

    <!-- TAGLINE WITH SIDE LINES -->
    <g id="tagline-group">
      <!-- Left Decorative Line -->
      <line
    x1="230"
    y1="392"
    x2="320"
    y2="392"
    stroke="#5A6470"
    stroke-width="2"
    stroke-linecap="round"/>
      
      <!-- Tagline Text -->
      <text
    x="535"
    y="399"
    text-anchor="middle"
    class="text-tagline">
    Smart Commerce Platform
</text>
      
      <!-- Right Decorative Line -->
      <line
    x1="750"
    y1="392"
    x2="840"
    y2="392"
    stroke="#5A6470"
    stroke-width="2"
    stroke-linecap="round"/>
    </g>
  </g>

</svg>
