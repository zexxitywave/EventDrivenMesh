server:
  port: 8093

spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/analytics_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 1000
        order_inserts: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    consumer:
      group-id: analytics-service-group
      auto-offset-reset: earliest
      max-poll-records: 2000
      fetch-min-size: 1048576       # 1MB â€” wait for more data before delivering
      fetch-max-wait: 500ms

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: analytics-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
      percentiles:
        http.server.requests: 0.5, 0.90, 0.95, 0.99

logging:
  level:
    com.hacisimsek.analytics: INFO

